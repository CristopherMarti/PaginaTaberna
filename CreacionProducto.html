<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creación - Taberna del Monkey</title>
    <link rel="stylesheet" href="CreacionProducto.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="nav-content">
            <a href="main.html" class="logo">
                <img src="LogosTabernas/Logo-color-rojo.png" alt="Logo Taberna del Monkey">
            </a>
            <ul class="nav-links">
                <li><a href="lista.html">Lista de Categoría</a></li>
                <li><a href="gestion.html">Gestión</a></li>
                <li><a href="CreacionProducto.html">Creación Producto</a></li>
                <li><a href="Login.html">Iniciar Sesión</a></li>
            </ul>
            <button class="mobile-menu" id="mobileMenu">☰</button>
        </div>
    </nav>

    <!-- Contenido principal -->
    <div class="container">
        <h1 class="titulo">Creación de Nuevo Producto</h1>

        <form class="form-producto">
            <div class="form-grupo">
                <label for="nombre">Nombre del Producto</label>
                <input type="text" id="nombre" name="nombre" placeholder="Ejemplo: Vodka Absolute 700ml" required>
            </div>

            <div class="form-grupo">
                <label for="categoria">Categoría</label>
                <select id="categoria" name="categoria" required>
                    <option value="" disabled selected>Selecciona una categoría</option>
                    <option value="licores">Licores</option>
                    <option value="gaseosas">Gaseosas</option>
                    <option value="snacks">Snacks</option>
                    <option value="otros">Otros</option>
                </select>
            </div>

            <div class="form-grupo">
                <label for="descripcion">Descripción</label>
                <textarea id="descripcion" name="descripcion" rows="4" placeholder="Breve descripción del producto"></textarea>
            </div>

            <div class="form-grupo">
                <label for="imagen">Imagen del Producto</label>
                <input type="file" id="imagen" name="imagen" accept="image/*">
            </div>

            <button type="submit" class="btn-guardar">Guardar Producto</button>
        </form>
    </div>

    <script>
        // Menú móvil responsive
        document.getElementById('mobileMenu').addEventListener('click', () => {
            const navLinks = document.querySelector('.nav-links');
            navLinks.style.display = navLinks.style.display === 'flex' ? 'none' : 'flex';
            navLinks.style.flexDirection = 'column';
            navLinks.style.background = '#fff';
            navLinks.style.padding = '1rem';
            navLinks.style.position = 'absolute';
            navLinks.style.top = '70px';
            navLinks.style.right = '20px';
            navLinks.style.boxShadow = '0 4px 10px rgba(0,0,0,0.1)';
        });
    </script>
</body>
</html>
