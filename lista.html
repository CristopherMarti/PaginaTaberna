<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Taberna del Monkey - Lista</title>
  <link rel="stylesheet" href="lista.css">
</head>
<body>
  <nav class="navbar">
        <div class="nav-content">
            <a href="main.html" class="logo">
                <img src="LogosTabernas/Logo-color-rojo.png" alt="Logo Taberna del Monkey">
            </a>
            <ul class="nav-links">
                <li><a href="main.html">Inicio</a></li>
                <li><a href="publicidad.html">Publicidad</a></li>
                <li><a href="lista.html">Lista de Categoría</a></li>
                <li><a href="conctacto.html">Contacto</a></li>
                <li><a href="gestion.html">Gestión</a></li>
                <li><a href="Login.html">Iniciar Sesión</a></li>
            </ul>
            <button class="mobile-menu" id="mobileMenu">☰</button>
        </div>
    </nav>

      <button class="mobile-menu" id="mobileMenu" aria-expanded="false">☰</button>
    </div>
  </nav>

  <main class="container" role="main">
    <header class="header" aria-labelledby="titulo-sistema">
      <div class="monkey-emoji">🐵</div>
      <h1 id="titulo-sistema">Taberna del Monkey</h1>
      <p class="subtitle">Sistema de Inventario — Catálogos</p>
    </header>

    <h2 class="categories-title">Selecciona una categoría:</h2>

    <section class="categories-grid" aria-label="Categorías de productos">
      <div class="category-item" role="button" tabindex="0" onclick="openModal('licores')" onkeydown="if(event.key==='Enter') openModal('licores')">
        <div class="category-circle licores">🥃</div>
        <span class="category-text">Licores</span>
      </div>

      <div class="category-item" role="button" tabindex="0" onclick="openModal('gaseosas')" onkeydown="if(event.key==='Enter') openModal('gaseosas')">
        <div class="category-circle gaseosas">🥤</div>
        <span class="category-text">Gaseosas</span>
      </div>

      <div class="category-item" role="button" tabindex="0" onclick="openModal('insumos')" onkeydown="if(event.key==='Enter') openModal('insumos')">
        <div class="category-circle insumos">🍯</div>
        <span class="category-text">Insumos</span>
      </div>

      <div class="category-item" role="button" tabindex="0" onclick="openModal('vasos')" onkeydown="if(event.key==='Enter') openModal('vasos')">
        <div class="category-circle vasos">🍺</div>
        <span class="category-text">Vasos y Jarras</span>
      </div>
    </section>
  </main>

  <!-- MODAL -->
  <div id="modal" class="modal" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal-content" role="document">
      <div class="modal-header">
        <h2 id="modal-title">Catálogo</h2>
        <button class="close" aria-label="Cerrar" onclick="closeModal()">&times;</button>
      </div>
      <div id="modal-body" class="modal-body">
        <!-- Contenido dinámico -->
      </div>
    </div>
  </div>

  <script src="lista.js"></script>
</body>
</html>
