<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gestión de Categorías - Taberna del Monkey</title>
  <link rel="stylesheet" href="lista.css">
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar">
    <div class="nav-content">
        <a href="main.html" class="logo">
            <img src="LogosTabernas/Logo-color-rojo.png" alt="Logo Taberna del Monkey">
        </a>
        <input type="checkbox" id="menu-toggle">
        <label for="menu-toggle" class="mobile-menu-label">☰</label>
        <ul class="nav-links">
            <li><a href="lista.html">Lista de Categoría</a></li>
            <li><a href="gestion.html">Gestión</a></li>
            <li><a href="CreacionProducto.html">Creación Producto</a></li>
            <li><a href="Login.html">Iniciar Sesión</a></li>
        </ul>
    </div>
  </nav>

  <main class="container">
    <header class="header">
      <div class="monkey-emoji">🐵</div>
      <h1>Gestión de Categorías</h1>
      <p class="subtitle">Administra las categorías del inventario</p>
    </header>

    <!-- Botón para ir a Creación de Productos -->
    <div class="action-buttons">
      <button class="btn-create-product" onclick="window.location.href='CreacionProducto.html'">
        📦 Ir a Creación de Productos
      </button>
      <button class="btn-primary" onclick="openCreateModal()">
        ➕ Nueva Categoría
      </button>
    </div>

    <!-- Lista de Categorías -->
    <section class="categories-section">
      <h2>Categorías Actuales</h2>
      <div id="categories-list" class="categories-list">
        <!-- Las categorías se cargarán dinámicamente -->
      </div>
    </section>
  </main>

  <!-- Modal para Crear/Editar Categoría -->
  <div id="categoryModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modalTitle">Nueva Categoría</h2>
        <button class="close" onclick="closeModal()">&times;</button>
      </div>
      <div class="modal-body">
        <form id="categoryForm">
          <input type="hidden" id="categoryId">
          
          <div class="form-group">
            <label for="categoryName">Nombre de la Categoría *</label>
            <input type="text" id="categoryName" placeholder="Ej: Licores" required>
          </div>

          <div class="form-group">
            <label for="categoryIcon">Ícono (Emoji) *</label>
            <input type="text" id="categoryIcon" placeholder="Ej: 🥃" maxlength="2" required>
          </div>

          <div class="form-group">
            <label for="categoryDescription">Descripción</label>
            <textarea id="categoryDescription" rows="3" placeholder="Descripción de la categoría"></textarea>
          </div>

          <div class="form-actions">
            <button type="button" class="btn-secondary" onclick="closeModal()">Cancelar</button>
            <button type="submit" class="btn-primary" id="submitBtn">Guardar</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Modal de Confirmación -->
  <div id="confirmModal" class="modal">
    <div class="modal-content modal-small">
      <div class="modal-header">
        <h2>Confirmar Eliminación</h2>
        <button class="close" onclick="closeConfirmModal()">&times;</button>
      </div>
      <div class="modal-body">
        <p>¿Estás seguro de eliminar esta categoría?</p>
        <p class="warning">⚠️ Esta acción no se puede deshacer.</p>
        <div class="form-actions">
          <button class="btn-secondary" onclick="closeConfirmModal()">Cancelar</button>
          <button class="btn-danger" onclick="confirmDelete()">Eliminar</button>
        </div>
      </div>
    </div>
  </div>

  <script src="lista.js"></script>
</body>
</html>
