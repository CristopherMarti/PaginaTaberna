<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Productos - Taberna del Monkey</title>
    <link rel="stylesheet" href="lista.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="nav-content">
            <a href="main.html" class="logo">
                <img src="LogosTabernas/Logo-color-rojo.png" alt="Logo Taberna del Monkey">
            </a>
            <label class="mobile-menu-label">☰</label>
            <ul class="nav-links">
                <li><a href="lista.html">Lista de Categoría</a></li>
                <li><a href="gestion.html">Gestión</a></li>
                <li><a href="CreacionProducto.html">Creación Producto</a></li>
                <li><a href="Login.html">Iniciar Sesión</a></li>
            </ul>
        </div>
    </nav>

    <main class="container">
        <!-- Header -->
        <header class="header">
            <div class="monkey-emoji">🐵</div>
            <h1>Gestión de Categorías</h1>
            <p class="subtitle">Administra las categorías del inventario</p>
        </header>

        <!-- Action Buttons -->
        <div class="action-buttons">
            <a href="CreacionProducto.html" class="btn btn-secondary">
                📦 Ir a Creación de Categoría
            </a>
            <a href="gestion.html" class="btn btn-primary">
                📊 Ver Gestión Completa (CRUD)
            </a>
        </div>

        <!-- Categories List -->
        <section class="categories-section">
            <h2>Categorías Actuales</h2>
            <div id="categories-list" class="categories-list">
                <!-- Las categorías se cargarán aquí -->
            </div>
        </section>
    </main>

    <!-- Modal de Productos -->
    <div id="products-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-title">
                    <span id="modal-icon">🥃</span>
                    <span id="modal-category-name">Licores</span>
                </h3>
                <button class="close-modal" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div id="products-container" class="products-grid">
                    <!-- Los productos se cargarán aquí -->
                </div>
            </div>
        </div>
    </div>

    <script>
        const categories = [
            { 
                id: 1, 
                name: 'Licores', 
                icon: '🥃', 
                description: 'Bebidas alcohólicas premium y cócteles especiales'
            },
            { 
                id: 2, 
                name: 'Gaseosas', 
                icon: '🥤', 
                description: 'Refrescos, bebidas sin alcohol y jugos naturales'
            },
            { 
                id: 3, 
                name: 'Vasos y Jarras', 
                icon: '🍺', 
                description: 'Utensilios de servicio, vasos, copas y jarras'
            }
        ];

        const products = [
            { 
                id: 1, 
                name: 'Pisco Quebranta', 
                categoryId: 1, 
                price: 45.00, 
                stock: 25, 
                unit: 'Botella',
                description: 'Pisco puro de uva Quebranta, ideal para preparar el clásico Pisco Sour. Producción artesanal con uvas seleccionadas.'
            },
            { 
                id: 2, 
                name: 'Pisco Sour', 
                categoryId: 1, 
                price: 28.00, 
                stock: 30, 
                unit: 'Vaso',
                description: 'Nuestro cóctel insignia preparado con pisco peruano, limón, jarabe y clara de huevo. Una experiencia única.'
            },
            { 
                id: 3, 
                name: 'Cerveza Pilsen', 
                categoryId: 1, 
                price: 14.00, 
                stock: 40, 
                unit: 'Botella',
                description: 'Cerveza rubia tipo Pilsen, refrescante y con cuerpo. Perfecta para acompañar momentos especiales.'
            },
            { 
                id: 4, 
                name: 'Ron Cartavio', 
                categoryId: 1, 
                price: 55.00, 
                stock: 8, 
                unit: 'Botella',
                description: 'Ron peruano añejado, suave y aromático. Ideal para disfrutar solo o en cócteles tropicales.'
            },
            { 
                id: 5, 
                name: 'Coca Cola', 
                categoryId: 2, 
                price: 3.50, 
                stock: 50, 
                unit: 'Botella',
                description: 'Refresco clásico de cola, burbujeante y refrescante. La bebida perfecta para cualquier ocasión.'
            },
            { 
                id: 6, 
                name: 'Inca Kola', 
                categoryId: 2, 
                price: 3.50, 
                stock: 45, 
                unit: 'Botella',
                description: 'La bebida del Perú, con su sabor único y característico. Tradición en cada sorbo.'
            },
            { 
                id: 7, 
                name: 'Sprite', 
                categoryId: 2, 
                price: 3.00, 
                stock: 12, 
                unit: 'Botella',
                description: 'Refresco de lima-limón, transparente y refrescante. Sabor cítrico que no falla.'
            },
            { 
                id: 8, 
                name: 'Chicha Morada', 
                categoryId: 2, 
                price: 22.00, 
                stock: 15, 
                unit: 'Jarra',
                description: 'Bebida tradicional peruana preparada con maíz morado, piña, canela y clavo de olor. Dulce y nutritiva.'
            },
            { 
                id: 9, 
                name: 'Vaso Cervecero', 
                categoryId: 3, 
                price: 8.00, 
                stock: 50, 
                unit: 'Unidad',
                description: 'Vaso de vidrio templado de 500ml, diseño clásico para servir cerveza bien fría con espuma perfecta.'
            },
            { 
                id: 10, 
                name: 'Copa de Vino', 
                categoryId: 3, 
                price: 12.00, 
                stock: 30, 
                unit: 'Unidad',
                description: 'Copa elegante de cristal para vino tinto o blanco. Diseño que realza el aroma y sabor del vino.'
            },
            { 
                id: 11, 
                name: 'Jarra 1L', 
                categoryId: 3, 
                price: 15.00, 
                stock: 9, 
                unit: 'Unidad',
                description: 'Jarra de vidrio con capacidad de 1 litro, ideal para servir bebidas compartidas como chicha o jugos.'
            },
            { 
                id: 12, 
                name: 'Vaso Shot', 
                categoryId: 3, 
                price: 5.00, 
                stock: 60, 
                unit: 'Unidad',
                description: 'Vaso pequeño de 50ml para shots y tragos cortos. Resistente y con medida exacta.'
            }
        ];

        function getProductsCountByCategory(categoryId) {
            return products.filter(p => p.categoryId === categoryId).length;
        }

        function getTotalStockByCategory(categoryId) {
            return products
                .filter(p => p.categoryId === categoryId)
                .reduce((sum, p) => sum + p.stock, 0);
        }

        function getAveragePriceByCategory(categoryId) {
            const categoryProducts = products.filter(p => p.categoryId === categoryId);
            if (categoryProducts.length === 0) return 0;
            const total = categoryProducts.reduce((sum, p) => sum + p.price, 0);
            return (total / categoryProducts.length).toFixed(2);
        }

        function getStockClass(stock) {
            if (stock > 20) return 'stock-disponible';
            if (stock > 10) return 'stock-medio';
            return 'stock-bajo';
        }

        function getStockText(stock) {
            if (stock > 20) return 'DISPONIBLE';
            if (stock > 10) return 'STOCK MEDIO';
            return 'BAJO STOCK';
        }

        function showProducts(categoryId) {
            const category = categories.find(c => c.id === categoryId);
            const categoryProducts = products.filter(p => p.categoryId === categoryId);

            document.getElementById('modal-icon').textContent = category.icon;
            document.getElementById('modal-category-name').textContent = category.name;

            const container = document.getElementById('products-container');

            if (categoryProducts.length === 0) {
                container.innerHTML = `
                    <div class="empty-products">
                        <div class="empty-products-icon">📦</div>
                        <p>No hay productos en esta categoría</p>
                    </div>
                `;
            } else {
                container.innerHTML = categoryProducts.map(product => `
                    <div class="product-card">
                        <div class="product-header">
                            <div>
                                <div class="product-name">${product.name}</div>
                            </div>
                            <div class="product-price">S/. ${product.price.toFixed(2)}</div>
                        </div>
                        <div class="product-description">
                            ${product.description}
                        </div>
                        <div class="product-meta">
                            <div class="product-stock">
                                📦 <strong>${product.stock}</strong> ${product.unit}${product.stock !== 1 ? 's' : ''}
                            </div>
                            <span class="stock-badge ${getStockClass(product.stock)}">
                                ${getStockText(product.stock)}
                            </span>
                        </div>
                    </div>
                `).join('');
            }

            document.getElementById('products-modal').classList.add('show');
        }

        function closeModal() {
            document.getElementById('products-modal').classList.remove('show');
        }

        // Cerrar modal al hacer clic fuera
        document.getElementById('products-modal').addEventListener('click', (e) => {
            if (e.target.id === 'products-modal') {
                closeModal();
            }
        });

        function renderCategories() {
            const container = document.getElementById('categories-list');
            
            container.innerHTML = categories.map(category => {
                const productCount = getProductsCountByCategory(category.id);
                const totalStock = getTotalStockByCategory(category.id);
                const avgPrice = getAveragePriceByCategory(category.id);

                return `
                    <div class="category-card">
                        <div class="category-info">
                            <div class="category-icon">${category.icon}</div>
                            <div class="category-details">
                                <h3>${category.name}</h3>
                                <p>${category.description}</p>
                                <div class="category-stats">
                                    <div class="stat-item">
                                        📦 <strong>${productCount}</strong> productos
                                    </div>
                                    <div class="stat-item">
                                        📊 <strong>${totalStock}</strong> unidades totales
                                    </div>
                                    <div class="stat-item">
                                        💰 Promedio: <strong>S/. ${avgPrice}</strong>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="category-actions">
                            <button class="btn-view" onclick="showProducts(${category.id})">👁️ Ver Productos</button>
                            <a href="CreacionProducto.html" class="btn-manage">➕ Agregar Producto</a>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Inicializar
        renderCategories();
    </script>
</body>
</html>
